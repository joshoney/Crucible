version: '3.8'

# Define a custom bridge network so all containers can resolve each other by name
networks:
  agent-platform-network:
    driver: bridge

volumes:
  postgres-data:
  minio-data:

services:
  # 1. PostgreSQL (The persistent state engine for Temporal)
  postgresql:
    image: postgres:14.24
    container_name: temporal-postgresql
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - agent-platform-network
    ports:
      - "5433:5432"

  # 2. Temporal Server (The Orchestration Control Plane)
  temporal:
    # auto-setup is deprecated upstream and 1.29.7 is its newest tag; see README for the migration path
    image: temporalio/auto-setup:1.29.7
    container_name: temporal-server
    depends_on:
      - postgresql
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - TEMPORAL_ADDRESS=temporal-server:7233
      - TEMPORAL_CLI_ADDRESS=temporal-server:7233
    networks:
      - agent-platform-network
    ports:
      - "7233:7233" # The gRPC port your Python worker and MCP Gateway connect to

  # 3. Temporal Web UI (For visualizing your workflows)
  temporal-ui:
    image: temporalio/ui:2.55.0
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal-server:7233
    networks:
      - agent-platform-network
    ports:
      - "8080:8080" # http://localhost:8080 to see your workflow traces

  # 4. MinIO (S3-compatible object storage for evaluerBench JSON results and HTML artifacts)
  minio:
    image: quay.io/minio/minio:RELEASE.2025-03-12T18-04-18Z
    container_name: minio-storage
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    networks:
      - agent-platform-network
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Web UI Port (http://localhost:9001)

  # 5. MinIO Init (ephemeral container that creates the "eval-artifacts" bucket)
  # It waits for MinIO to start, creates the bucket, and exits with 0 (success).
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-03-12T17-29-24Z
    container_name: minio-init
    depends_on:
      - minio
    networks:
      - agent-platform-network
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb localminio/eval-artifacts;
      /usr/bin/mc anonymous set public localminio/eval-artifacts;
      exit 0;
      "

  # 6. The Temporal Worker (Executes evaluerBench)
  eval-worker:
    build:
      context: ./eval-orchestrator
      dockerfile: Dockerfile
      args:
        # Branch, tag, or commit SHA of evaluerBench to bake into the image
        - EVALUERBENCH_REF=${EVALUERBENCH_REF:-main}
    container_name: eval-worker
    depends_on:
      - temporal
      - minio
    networks:
      - agent-platform-network
    environment:
      # Temporal Settings
      - TEMPORAL_URL=temporal-server:7233
      # MinIO Settings
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=eval-artifacts
      # LangSmith Settings (Inject these securely in your actual environment)
      - LANGCHAIN_TRACING_V2=true
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=evaluerBench-Docker
      # Lemonade server on the LAN (model provisioning); e.g. http://10.10.0.12:8000/api/v1
      - LEMONADE_API_URL=${LEMONADE_API_URL}
      - TARGET_BASE_URL=${TARGET_BASE_URL:-${LEMONADE_API_URL}}
      - EVALUATOR_BASE_URL=${EVALUATOR_BASE_URL}
      - EVALUATOR_API_KEY=${EVALUATOR_API_KEY}
      - EVALUATOR_MODEL=${EVALUATOR_MODEL}
      # Publishing target (results are committed to this repo/branch)
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      - TARGET_BRANCH=${TARGET_BRANCH:-main}
      # Check Lemonade's /health lists the model after /load, before the eval starts
      - LEMONADE_VERIFY_LOADED=${LEMONADE_VERIFY_LOADED:-true}
      # Scratch dirs of failed/cancelled runs older than this are deleted (0 disables)
      - SCRATCH_RETENTION_DAYS=${SCRATCH_RETENTION_DAYS:-7}
    volumes:
      # Bind-mount the worker code so Python changes need no rebuild. evaluerBench output
      # lands in ./eval-orchestrator/scratchpad/<task_id> (gitignored) through this mount.
      - ./eval-orchestrator:/app

  # 7. MCP Gateway (FastMCP over SSE; submits workflows to Temporal)
  mcp-gateway:
    build:
      context: ./mcp-gateway
      dockerfile: Dockerfile
    container_name: mcp-gateway
    depends_on:
      - temporal
    networks:
      - agent-platform-network
    ports:
      - "8081:8000" # MCP clients connect to the SSE endpoint at http://<host>:8081/sse
    environment:
      # The gateway only talks to Temporal; publishing is done by eval-worker
      - TEMPORAL_URL=temporal-server:7233
    volumes:
      - ./mcp-gateway:/app